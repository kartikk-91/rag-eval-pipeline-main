name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest tests/ -q -rs

      # Licensed PDFs and model weights are intentionally not committed, so CI
      # checks pipeline contracts and review schemas without downloading a corpus
      # or asserting the machine-specific local retrieval baseline.
